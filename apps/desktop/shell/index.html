<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autodekt</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="titlebar">
      <div class="brand" aria-label="Autodekt">
        <span class="brand-mark" aria-hidden="true">A</span>
        <span class="brand-name">Autodekt</span>
      </div>
      <button
        id="sidebar"
        class="titlebar-button sidebar-button"
        type="button"
        aria-label="Hide sidebar"
        aria-pressed="false"
        title="Hide sidebar"
      >
        <svg aria-hidden="true" viewBox="0 0 16 16">
          <rect x="2.25" y="2.75" width="11.5" height="10.5" rx="2"></rect>
          <path d="M6 3v10"></path>
        </svg>
      </button>
      <nav class="navigation" aria-label="Page navigation">
        <button id="back" class="titlebar-button" type="button" aria-label="Back" title="Back">
          <span aria-hidden="true">←</span>
        </button>
        <button
          id="forward"
          class="titlebar-button"
          type="button"
          aria-label="Forward"
          title="Forward"
        >
          <span aria-hidden="true">→</span>
        </button>
        <button
          id="reload"
          class="titlebar-button"
          type="button"
          aria-label="Reload"
          title="Reload"
        >
          <span aria-hidden="true">↻</span>
        </button>
      </nav>
      <div class="drag-region" aria-hidden="true"></div>
    </header>
    <script type="module" src="../dist/shell.js"></script>
  </body>
</html>
